[install]
# Updated to allow normal install/update flows in this repo.
frozenLockfile = false
# proot/aarch64 EPERM fix: default "hardlink"/"copy" backends fail on this host
# (PermissionDenied copying cache -> node_modules). "symlink" is the proven
# clean-slate backend (see reference/bun-store-clean-slate-reinstall.md).
backend = "symlink"
exact = false

[install.cache]
disable = false
