services:
  mira-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: mira-server:staging
    env_file:
      - .env.staging
    ports:
      - '4096:4096'
    environment:
      NODE_ENV: staging
      HOST: 0.0.0.0
      MIRA_STRICT_AUTH: '1'
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4096/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
