name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Bun audit (fail on high/critical)
        # `bun audit` exits nonzero on ANY finding (including dev-only lows),
        # so this step gates the build on high/critical only. Entries in the
        # allowlist below are accepted risks with documented reasons; everything
        # else fails the build. Revisit the allowlist when upstreams move.
        run: |
          # Tolerate bun audit's nonzero exit (fires on ANY finding, even
          # dev-only lows) — the jq gate below enforces high/critical only.
          bun audit --json > /tmp/bun-audit.json || true
          # Explicit, traceable allowlist (documented in SECURITY_EXCEPTIONS.md):
          # - GHSA-mrhx-c7xc-m3w5 (zod constrained collection memory)
          # - GHSA-vrm6-8vpv-qv8q, GHSA-v9p9-hfj2-hcw8, GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm, GHSA-vxpw-j846-p89q (nested undici via @ai-sdk)
          # - GHSA-w4pp-8pjf-rmxw (pacote via semantic-release)
          # - GHSA-52v5-jr5w-gjxr (sigstore via npm/release toolchain)
          BLOCKING=$(jq '[. as $root
            | keys[] as $pkg
            | $root[$pkg][] as $f
            | select($f.severity == "high" or $f.severity == "critical")
            | select(
              ($f.url // "") as $url
              | ["GHSA-mrhx-c7xc-m3w5", "GHSA-vrm6-8vpv-qv8q", "GHSA-v9p9-hfj2-hcw8", "GHSA-2m5v-pch6-74hx", "GHSA-qrxm-fqhp-jwvm", "GHSA-vxpw-j846-p89q", "GHSA-w4pp-8pjf-rmxw", "GHSA-52v5-jr5w-gjxr"]
              | any(. == ($url | split("/")[-1]))
              | not
            )] | length' /tmp/bun-audit.json)
          echo "blocking high/critical findings: $BLOCKING"
          if [ "$BLOCKING" != "0" ]; then
            jq -r '. as $root | keys[] as $pkg | $root[$pkg][] | select(.severity == "high" or .severity == "critical") | "\(.severity): \($pkg): \(.title) (\(.url))"' /tmp/bun-audit.json
            exit 1
          fi
      # NOTE: google/osv-scanner-action removed 2026-09-20 — the upstream
      # repo no longer ships a root action.yml at any tag (v1.9.2 and v2.6.0
      # both fail job setup with "Top level 'runs:' section is required"),
      # which fails the whole job before continue-on-error can apply.
      # `bun audit` with the high/critical jq gate above remains the
      # enforcing dependency-vuln check. Re-add OSV coverage with a working
      # action (or `osv-scanner` binary via bunx) if desired.

  secrets:
    name: secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: '/language:${{ matrix.language }}'
