name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Bun audit (fail on high/critical)
        # `bun audit` exits nonzero on ANY finding (including dev-only lows),
        # so this step gates the build on high/critical only. Entries in the
        # allowlist below are accepted risks with documented reasons; everything
        # else fails the build. Revisit the allowlist when upstreams move.
        run: |
          # Tolerate bun audit's nonzero exit (fires on ANY finding, even
          # dev-only lows) — the jq gate below enforces high/critical only.
          bun audit --json > /tmp/bun-audit.json || true
          BLOCKING=$(jq '[. as $root
            | keys[] as $pkg
            | $root[$pkg][] as $f
            | select($f.severity == "high" or $f.severity == "critical")
            | select(
              # allowlist:
              # - pacote/sigstore: npm toolchain, never in runtime bundle
              # - undici: only the nested 5.29.0 (via @ai-sdk/provider-utils) is
              #   in range; top-level 7.29.0 is clean. No upgrade path until the
              #   AI SDK moves off undici 5 (server never uses its websockets).
              # - braces: GHSA-vfj7-8cjw-p6xm (ReDoS) has NO patched release —
              #   vulnerable <= 3.0.3 and 3.0.3 is the latest published. Dev-only
              #   path (micromatch via semantic-release in packages/cli). Revisit
              #   when upstream ships a fix.
              ([$pkg, $f.title] | join(" ") | test("pacote|sigstore|undici|braces") | not)
            )] | length' /tmp/bun-audit.json)
          echo "blocking high/critical findings: $BLOCKING"
          if [ "$BLOCKING" != "0" ]; then
            jq -r '. as $root | keys[] as $pkg | $root[$pkg][] | select(.severity == "high" or .severity == "critical") | "\(.severity): \($pkg): \(.title) (\(.url))"' /tmp/bun-audit.json
            exit 1
          fi
      # NOTE: google/osv-scanner-action removed 2026-09-20 — the upstream
      # repo no longer ships a root action.yml at any tag (v1.9.2 and v2.6.0
      # both fail job setup with "Top level 'runs:' section is required"),
      # which fails the whole job before continue-on-error can apply.
      # `bun audit` with the high/critical jq gate above remains the
      # enforcing dependency-vuln check. Re-add OSV coverage with a working
      # action (or `osv-scanner` binary via bunx) if desired.

  secrets:
    name: secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@9f759ee644a3e7c15c1390abf49868036c00067b # v3
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          category: '/language:${{ matrix.language }}'
