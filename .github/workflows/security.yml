name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Bun audit
        run: bun install --frozen-lockfile
      - name: Bun audit (fail on high/critical)
        # `bun audit` exits nonzero on ANY finding (including dev-only lows),
        # so this step gates the build on high/critical only. Entries in the
        # allowlist below are accepted risks with documented reasons; everything
        # else fails the build. Revisit the allowlist when upstreams move.
        run: |
          bun audit --json > /tmp/bun-audit.json || true
          BLOCKING=$(jq '[. as $root
            | keys[] as $pkg
            | $root[$pkg][] as $f
            | select($f.severity == "high" or $f.severity == "critical")
            | select(
              # allowlist:
              # - pacote/sigstore: npm toolchain, never in runtime bundle
              # - undici: only the nested 5.29.0 (via @ai-sdk/provider-utils) is
              #   in range; top-level 7.29.0 is clean. No upgrade path until the
              #   AI SDK moves off undici 5 (server never uses its websockets).
              ([$pkg, $f.title] | join(" ") | test("pacote|sigstore|undici") | not)
            )] | length' /tmp/bun-audit.json)
          echo "blocking high/critical findings: $BLOCKING"
          if [ "$BLOCKING" != "0" ]; then
            jq -r '. as $root | keys[] as $pkg | $root[$pkg][] | select(.severity == "high" or .severity == "critical") | "\(.severity): \($pkg): \(.title) (\(.url))"' /tmp/bun-audit.json
            exit 1
          fi
      - name: OSV scanner
        uses: google/osv-scanner-action@v1.9.2
        with:
          scan-args: |-
            --recursive
            ./
        continue-on-error: true

  secrets:
    name: secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
