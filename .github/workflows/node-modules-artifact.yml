name: Node Modules Artifact

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --ignore-scripts
      - name: Create node_modules zip with dereferenced files
        run: |
          cd node_modules
          zip -r ../node_modules.zip . -x "*/.git/*"
          ls -lh ../node_modules.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-modules-${{ github.sha }}
          path: node_modules.zip
          retention-days: 7
