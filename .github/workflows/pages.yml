name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege: the build job gets read-only; only the deploy job escalates
# to pages:write + id-token (required by actions/deploy-pages OIDC flow).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ vars.PAGES_API_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          cache: true
          cache-dependency-path: bun.lock
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web client
        working-directory: packages/web
        run: bunx vite build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
