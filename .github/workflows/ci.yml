name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# H3-C Fix 3 — Vercel Remote Cache passthrough (verdict §5.4 / §7.4).
# Empty when secrets/vars are absent (forks) — turbo treats unset as
# "no remote cache" and still uses the local .turbo cache. Never fails.
# NOTE: the token is scoped per-job (build/test/eval) — a top-level env would
# inject it into jobs that never touch turbo (repo-hygiene, auth-guard, changes).

jobs:
  # H3-C Fix 3 — path-filtered gating (verdict §5.5 / §7.4). Keeps one
  # workflow; docs-only PRs skip build/test as "skipped" (never a vacuous
  # green pass). No `paths:` at top level — that would skip CI entirely.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      slack: ${{ steps.filter.outputs.slack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'packages/**'
              - 'turbo.json'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
            server:
              - 'packages/server/**'
              - 'packages/shared/**'
              - 'turbo.json'
              - 'bun.lock'
              - 'package.json'
              - 'bunfig.toml'
            web:
              - 'packages/web/**'
              - 'packages/shared/**'
              - 'turbo.json'
              - 'bun.lock'
              - 'package.json'
              - 'bunfig.toml'
            slack:
              - 'packages/slack/**'
              - 'packages/shared/**'
              - 'turbo.json'
              - 'bun.lock'
              - 'package.json'
              - 'bunfig.toml'

  repo-hygiene:
    name: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail if node_modules is tracked in git
        # 2026-09-20: 92 tracked node_modules symlinks broke cross-machine
        # sync (Windows↔Android) and CI with dangling links that
        # `bun install` will not overwrite. node_modules must NEVER be
        # committed (not even with -f) — .gitignore already covers it.
        run: |
          TRACKED=$(git ls-files | grep -E '(^|/)node_modules/' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::node_modules files are tracked in git:"
            echo "$TRACKED" | head -20
            echo "Remove with: git ls-files | grep node_modules | xargs git rm --cached"
            exit 1
          fi
          echo "repo hygiene ok — no tracked node_modules"

  auth-guard:
    name: auth-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install
      - name: Verify install integrity
        run: node scripts/verify-install.js
      - name: Verify auth hygiene (MIRA_TOKEN placeholder + gen script + no real secrets)
        run: |
          test -x scripts/gen-mira-token.sh || (echo "missing scripts/gen-mira-token.sh (chmod +x)" && exit 1)
          grep -q "change-me-to-a-long-random-secret" .env.example || (echo ".env.example must keep placeholder" && exit 1)
          grep -q "scripts/gen-mira-token.sh" .env.example || (echo ".env.example must reference gen script" && exit 1)
          # Fail if a real-looking secret is committed (96-hex API key pattern) outside .env.example comments
          if grep -R --include="*.ts" --include="*.js" -E "[0-9a-f]{64,96}" packages/server/src/config packages/server/src/routes 2>/dev/null | grep -v "change-me" | grep -qv "test\|spec\|mock"; then
            echo "real secret committed — rotate and remove"
            grep -R --include="*.ts" -E "[0-9a-f]{64,96}" packages/server/src/config packages/server/src/routes 2>/dev/null | head
            exit 1
          fi
          # Server must refuse to start with STRICT_AUTH and no token (fail-closed).
          # Capture output so a failure shows the actual server error in the log.
          MIRA_STRICT_AUTH=1 MIRA_TOKEN="" NODE_ENV=production timeout 15 bun run --cwd packages/server src/index.ts > /tmp/auth-out.txt 2>&1 || true
          cat /tmp/auth-out.txt
          grep -q "refusing to start without auth" /tmp/auth-out.txt || (echo "STRICT_AUTH fail-closed check failed" && exit 1)
          echo "auth guard passed"

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install
      - name: Verify install integrity
        run: node scripts/verify-install.js
      - name: Typecheck
        # NOTE: --continue is a CLI flag (turbo.json must NOT get a `continue`
        # key — reverted in c49d8d2a). Tri-state mode for typecheck is
        # `dependencies-successful` (see scripts/ci/turbo-tri-state.js --list).
        run: bunx turbo run typecheck --continue --cache-dir=.turbo

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [changes, typecheck]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    # Docs-only PRs skip (status "skipped", never green-on-empty).
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # required for the ...[base...HEAD] affected filter
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install
      - name: Verify install integrity
        run: node scripts/verify-install.js
      - name: Turborepo remote cache
        # Cache-integrity: PRs RESTORE but never SAVE (a poisoned PR cache must
        # not leak into main builds), and the turbo-main- prefix is written only
        # by main runs. Same contract in the test job.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: turbo-cache
        with:
          path: .turbo
          key: turbo-main-${{ github.sha }}
          restore-keys: turbo-main-
      - name: Turborepo remote cache login (optional)
        # `secrets.*` is NOT allowed in step-level `if:` — read the mapped env var
        # (top-level `env: TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}`) instead.
        # Forks without the secret skip gracefully instead of failing.
        if: ${{ env.TURBO_TOKEN != '' }}
        run: |
          echo "Remote cache enabled (team: ${{ vars.TURBO_TEAM }})."
          bunx turbo --version
      - name: Build (affected on PRs, full otherwise)
        # H3-C Fix 3 — affected-only PR builds (verdict §5.2 / §7.4), ~40-60%
        # PR CI cut with zero lockfile migration. --dry=json plans without
        # executing; an empty task list or a graph error falls back to a FULL
        # build — never green on empty. Push-to-main always builds full.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" || true
            FILTER="...[$BASE...HEAD]"
            if bunx turbo run build --filter="$FILTER" --dry=json > /tmp/turbo-plan.json 2>/tmp/turbo-plan.err; then
              TASKS=$(node -e 'const p=require("/tmp/turbo-plan.json"); console.log(((p&&(p.tasks||[]))||[]).length);')
              if [ "$TASKS" -gt 0 ]; then
                echo "Affected build: $TASKS task(s) for filter $FILTER"
                bunx turbo run build --filter="$FILTER" --continue --cache-dir=.turbo
              else
                echo "Affected filter resolved 0 tasks — falling back to FULL build (never green on empty)."
                bunx turbo run build --continue --cache-dir=.turbo
              fi
            else
              echo "Affected graph failed — falling back to FULL build."
              cat /tmp/turbo-plan.err || true
              bunx turbo run build --continue --cache-dir=.turbo
            fi
          else
            bunx turbo run build --continue --cache-dir=.turbo
          fi
      - name: Check blocking failures (tri-state)
        if: always()
        # Usage: node scripts/ci/turbo-tri-state.js --require=@mira/server,@mira/shared
        # Tri-state: blocking pkg failed → exit 1 (never); only non-blocking
        # failed → warning, exit 0 (dependencies-successful); none → exit 0 (always).
        run: node scripts/ci/turbo-tri-state.js --require=@mira/server,@mira/shared
      - name: Save turbo cache (main only — PRs must never write the namespace)
        if: github.event_name != 'pull_request' && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-main-${{ github.sha }}

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [changes, build]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # required for the ...[base...HEAD] affected filter
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install
      - name: Verify install integrity
        run: node scripts/verify-install.js
      - name: Turborepo cache
        # Restore-only — PR runs must never write the shared cache namespace.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: turbo-cache
        with:
          path: .turbo
          key: turbo-main-${{ github.sha }}
          restore-keys: turbo-main-
      - name: Test (affected on PRs, full otherwise)
        # Same affected + full-build-fallback contract as the build job above.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" || true
            FILTER="...[$BASE...HEAD]"
            if bunx turbo run test --filter="$FILTER" --dry=json > /tmp/turbo-plan.json 2>/tmp/turbo-plan.err; then
              TASKS=$(node -e 'const p=require("/tmp/turbo-plan.json"); console.log(((p&&(p.tasks||[]))||[]).length);')
              if [ "$TASKS" -gt 0 ]; then
                echo "Affected test: $TASKS task(s) for filter $FILTER"
                bunx turbo run test --filter="$FILTER" --continue --cache-dir=.turbo
              else
                echo "Affected filter resolved 0 tasks — falling back to FULL test (never green on empty)."
                bunx turbo run test --continue --cache-dir=.turbo
              fi
            else
              echo "Affected graph failed — falling back to FULL test."
              cat /tmp/turbo-plan.err || true
              bunx turbo run test --continue --cache-dir=.turbo
            fi
          else
            bunx turbo run test --continue --cache-dir=.turbo
          fi
      - name: Check blocking failures (tri-state)
        if: always()
        run: node scripts/ci/turbo-tri-state.js --require=@mira/server,@mira/shared
      - name: Save turbo cache (main only — PRs must never write the namespace)
        if: github.event_name != 'pull_request' && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-main-${{ github.sha }}

  eval:
    name: eval (PR fast)
    runs-on: ubuntu-latest
    needs: build
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    # 3-tier: PR runs only fast checks; full suite is nightly (eval.yml)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install
      - name: Verify install integrity
        run: node scripts/verify-install.js
      - name: Turborepo cache
        # Restore-only — PR runs must never write the shared cache namespace.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: turbo-cache
        with:
          path: .turbo
          key: turbo-main-${{ github.sha }}
          restore-keys: turbo-main-
      - name: Eval — fast tier (PR)
        run: bunx turbo run eval --continue --cache-dir=.turbo -- --tier=fast
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results-pr
          path: |
            .turbo/**/eval-*.json
            packages/server/src/eval/results/**
          if-no-files-found: ignore
