name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  id-token: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install
      - name: Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-
      - name: Build
        run: bunx turbo run build --cache-dir=.turbo
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/*/dist
            .turbo

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: docker
    if: vars.DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deploy variables
        run: |
          if [ -z "${{ vars.DEPLOY_HOOK_URL }}" ] || [ -z "${{ vars.DEPLOY_TOKEN }}" ]; then
            echo "::error::Required deploy variables DEPLOY_HOOK_URL and DEPLOY_TOKEN are missing or empty"
            exit 1
          fi
      - name: Deploy
        run: |
          echo "Deploying ghcr.io/${{ github.repository }}:${{ github.sha }} to ${{ vars.DEPLOY_URL }}"
          # Example: trigger deploy hook / helm upgrade / fly deploy
          if [ -n "${{ secrets.DEPLOY_HOOK_URL }}" ]; then
            curl -fsSL -X POST "${{ secrets.DEPLOY_HOOK_URL }}" \
              -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"image\":\"ghcr.io/${{ github.repository }}:${{ github.sha }}\"}"
          else
            echo "::notice::DEPLOY_HOOK_URL not set — skipping external deploy"
          fi
      - name: Health check
        if: vars.DEPLOY_URL != ''
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsSL "${{ vars.DEPLOY_URL }}/health" | grep -q ok; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Health check did not pass"

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install
      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Publish mira-cli-ts from its package dir (has its own .releaserc.json,
          # toolchain pinned in packages/cli devDependencies).
          # NOTE: publishing to npm requires secrets.NPM_TOKEN to be set.
          # Without it, semantic-release's npm plugin fails auth, so use the
          # GitHub-release-only fallback (tag scheme matches tagFormat).
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set — creating GitHub release only (no npm publish)"
            VERSION=$(bun -e "console.log(require('./packages/cli/package.json').version)")
            TAG="mira-cli-v${VERSION}"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists — skipping release"
            else
              gh release create "$TAG" --generate-notes --target "${{ github.sha }}"
            fi
          else
            (cd packages/cli && bunx semantic-release)
          fi
