name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: read-only at the workflow level; each job escalates only
# what it needs (docker → packages:write; release → contents:write + id-token
# for npm provenance). `issues: write` was never used here and is gone.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install
      - name: Turborepo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          # main-only key namespace: PR runs never save (see ci.yml), and the
          # restore prefix is turbo-main- — a poisoned PR cache can never leak in.
          key: turbo-main-${{ github.sha }}
          restore-keys: turbo-main-
      - name: Build
        run: bunx turbo run build --cache-dir=.turbo
      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            packages/*/dist
            .turbo

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
    if: vars.DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Vars/secrets reach the script through the environment, never through
      # ${{ }} interpolation — direct interpolation into `run:` is the classic
      # template-injection surface, and quoting inside the script is fragile.
      - name: Validate deploy variables
        env:
          DEPLOY_HOOK_URL: ${{ vars.DEPLOY_HOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::Required deploy variables vars.DEPLOY_HOOK_URL and secrets.DEPLOY_TOKEN are missing or empty"
            exit 1
          fi
      - name: Deploy
        env:
          DEPLOY_HOOK_URL: ${{ vars.DEPLOY_HOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          echo "Deploying $IMAGE to $DEPLOY_URL"
          # Example: trigger deploy hook / helm upgrade / fly deploy
          if [ -n "${{ vars.DEPLOY_HOOK_URL }}" ]; then
            # Deploy hook payload built with jq — no string-concatenated JSON.
            curl -fsSL -X POST "$DEPLOY_HOOK_URL" \
              -H "Authorization: Bearer $DEPLOY_TOKEN" \
              -H "Content-Type: application/json" \
              --data-raw "$(jq -n --arg img "$IMAGE" '{image: $img}')"
          else
            echo "::notice::DEPLOY_HOOK_URL not set — skipping external deploy"
          fi
      - name: Health check
        if: vars.DEPLOY_URL != ''
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsSL "$DEPLOY_URL/health" | grep -q ok; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Health check did not pass"

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [build, docker]
    # npm provenance — semantic-release signs the publish with the job's OIDC
    # token (paired with NPM_CONFIG_PROVENANCE in the step below).
    permissions:
      contents: write
      id-token: write
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install
      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance — signed publish backed by the job's OIDC token
          # (granted via the release job's id-token: write).
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          # Publish mira-cli-ts from its package dir (has its own .releaserc.json,
          # toolchain pinned in packages/cli devDependencies).
          # NOTE: publishing to npm requires secrets.NPM_TOKEN to be set.
          # Without it, semantic-release's npm plugin fails auth, so use the
          # GitHub-release-only fallback (tag scheme matches tagFormat).
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set — creating GitHub release only (no npm publish)"
            VERSION=$(bun -e "console.log(require('./packages/cli/package.json').version)")
            TAG="mira-cli-v${VERSION}"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists — skipping release"
            else
              gh release create "$TAG" --generate-notes --target "${{ github.sha }}"
            fi
          else
            (cd packages/cli && bunx semantic-release)
          fi
