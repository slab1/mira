name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: read-only at the workflow level; each job escalates only
# what it needs (docker → packages:write; release → contents:write + id-token
# for npm provenance). `issues: write` was never used here and is gone.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install
      - name: Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          # main-only key namespace: PR runs never save (see ci.yml), and the
          # restore prefix is turbo-main- — a poisoned PR cache can never leak in.
          key: turbo-main-${{ github.sha }}
          restore-keys: turbo-main-
      - name: Build
        run: bunx turbo run build --cache-dir=.turbo
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            packages/*/dist
            .turbo

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
    if: vars.DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    outputs:
      deployed-sha: ${{ steps.deploy-record.outputs.deployed-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Vars/secrets reach the script through the environment, never through
      # ${{ }} interpolation — direct interpolation into `run:` is the classic
      # template-injection surface, and quoting inside the script is fragile.
      #
      # TO ENABLE REAL DEPLOYS, set in Repo Settings → Secrets and variables → Actions:
      #   Variable  DEPLOY_HOOK_URL  — your deploy webhook endpoint
      #   Variable  DEPLOY_URL       — base URL for the post-deploy /health check (optional)
      #   Secret    DEPLOY_TOKEN     — bearer token the webhook authenticates with
      # Until the hook exists, the deploy step below is a graceful no-op.
      - name: Validate deploy variables
        env:
          DEPLOY_HOOK_URL: ${{ vars.DEPLOY_HOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ] && [ -z "$DEPLOY_TOKEN" ]; then
            echo "::notice::Deploy hook not configured yet (set vars.DEPLOY_HOOK_URL + secret DEPLOY_TOKEN) — deploy will be a no-op"
            exit 0
          fi
          # Partial config IS a mistake: a hook without its token would deploy unauthenticated.
          if [ -z "$DEPLOY_HOOK_URL" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::Partial deploy config — vars.DEPLOY_HOOK_URL and secret DEPLOY_TOKEN must BOTH be set"
            exit 1
          fi
      - name: Deploy
        env:
          DEPLOY_HOOK_URL: ${{ vars.DEPLOY_HOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          echo "Deploying $IMAGE to $DEPLOY_URL"
          # Example: trigger deploy hook / helm upgrade / fly deploy
          # Read the URL from the environment, not ${{ vars.* }} — direct
          # interpolation into `run:` is the template-injection
          # surface the comment warns about, and a hook URL with a quote in it
          # would otherwise corrupt this script.
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            # Deploy hook payload built with jq — no string-concatenated JSON.
            curl -fsSL -X POST "$DEPLOY_HOOK_URL" \
              -H "Authorization: Bearer $DEPLOY_TOKEN" \
              -H "Content-Type: application/json" \
              --data-raw "$(jq -n --arg img "$IMAGE" '{image: $img}')"
          else
            echo "::notice::DEPLOY_HOOK_URL not set — skipping external deploy"
          fi
          # Record deployed SHA for audit trail
          echo "DEPLOYED_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "DEPLOYED_IMAGE=$IMAGE" >> $GITHUB_ENV
      - name: Health check (hard gate)
        if: vars.DEPLOY_URL != ''
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsSL "$DEPLOY_URL/health" | grep -q ok; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Health check failed after 5 attempts — deployment unhealthy"
          exit 1
      - name: Record deployed SHA
        if: success()
        run: |
          echo "deployed-sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "Deployed SHA: ${{ github.sha }}"
          echo "Deployed image: ${{ env.DEPLOYED_IMAGE }}"
        id: deploy-record

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [build, docker]
    # npm provenance — semantic-release signs the publish with the job's OIDC
    # token (paired with NPM_CONFIG_PROVENANCE in the step below).
    permissions:
      contents: write
      id-token: write
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install
      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance — signed publish backed by the job's OIDC token
          # (granted via the release job's id-token: write).
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          # Publish mira-cli-ts from its package dir (has its own .releaserc.json,
          # toolchain pinned in packages/cli devDependencies).
          # NOTE: publishing to npm requires a VALID secrets.NPM_TOKEN. Absent OR
          # invalid → GitHub-release-only fallback (tag scheme matches tagFormat),
          # with a loud warning so a broken publish stays visible.
          if [ -n "$NPM_TOKEN" ]; then
            # Pre-flight auth check — semantic-release aborts the whole job on an
            # invalid token, so verify before handing the token over.
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc"
            if ! npm whoami --userconfig "$RUNNER_TEMP/npmrc" --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "::warning::NPM_TOKEN is set but INVALID (npm whoami failed) — falling back to GitHub-release-only. Rotate the token to restore npm publishing."
              NPM_TOKEN=""
            fi
          fi
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set — creating GitHub release only (no npm publish)"
            VERSION=$(bun -e "console.log(require('./packages/cli/package.json').version)")
            TAG="mira-cli-v${VERSION}"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists — skipping release"
            else
              gh release create "$TAG" --generate-notes --target "${{ github.sha }}"
            fi
          else
            (cd packages/cli && bunx semantic-release)
          fi
