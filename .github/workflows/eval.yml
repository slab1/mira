name: Nightly Eval

on:
  schedule:
    - cron: "0 2 * * *" # daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      tier:
        description: "Eval tier to run"
        type: choice
        default: full
        options: [fast, standard, full]

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  nightly-eval:
    name: nightly eval
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EVAL_TIER: ${{ inputs.tier || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true
          cache-dependency-path: bun.lock
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-
      - name: Build
        run: bunx turbo run build --cache-dir=.turbo

      # --- LLM-as-judge ---
      - name: Eval — LLM-as-judge
        continue-on-error: true
        run: bunx turbo run eval --cache-dir=.turbo -- --suite=judge --tier=${{ env.EVAL_TIER }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      # --- SWE-bench ---
      - name: Eval — SWE-bench
        continue-on-error: true
        run: bunx turbo run eval --cache-dir=.turbo -- --suite=swe-bench --tier=${{ env.EVAL_TIER }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # --- Terminal-Bench ---
      - name: Eval — Terminal-Bench
        run: bunx turbo run eval --cache-dir=.turbo -- --suite=terminal-bench --tier=${{ env.EVAL_TIER }}

      # --- LoCoMo (memory / long-context) ---
      - name: Eval — LoCoMo
        run: bunx turbo run eval --cache-dir=.turbo -- --suite=locomo --tier=${{ env.EVAL_TIER }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-${{ github.run_id }}
          path: |
            .turbo/**/eval-*.json
            packages/server/src/eval/results/**
            eval-results/**
          if-no-files-found: warn

      - name: Publish summary
        if: always()
        run: |
          echo "## Nightly Eval — ${{ env.EVAL_TIER }} — $(date -u +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for f in $(find .turbo eval-results packages/server/src/eval/results -name "eval-*.json" 2>/dev/null | head -20); do
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            head -100 "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          if [ ! -f "$GITHUB_STEP_SUMMARY" ] || [ "$(wc -l < "$GITHUB_STEP_SUMMARY")" -le 2 ]; then
            echo "No eval JSON found — check turbo eval outputs." >> "$GITHUB_STEP_SUMMARY"
          fi

  prod-drift:
    name: prod drift check
    runs-on: ubuntu-latest
    needs: nightly-eval
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Drift check
        env:
          EVAL_BASELINE_PATH: eval/baseline.json
          EVAL_RESULTS_GLOB: "eval-results/**/*.json"
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          bun run eval -- --check-drift || echo "::warning::Drift check not configured or baseline missing"
      - name: Notify on drift
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ Nightly eval drift detected — ${new Date().toISOString().slice(0,10)}`;
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCheck eval artifacts for details.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['eval', 'drift'],
            }).catch(e => core.warning(`issue create failed: ${e.message}`));
