name: Nightly Eval

on:
  schedule:
    - cron: '0 2 * * 0' # weekly on Sunday at 02:00 UTC
  workflow_dispatch:
    inputs:
      tier:
        description: 'Eval tier to run'
        type: choice
        default: full
        options: [fast, standard, full]

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  nightly-eval:
    name: nightly eval
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EVAL_TIER: ${{ inputs.tier || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
          cache: true
          cache-dependency-path: bun.lock
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-
      - name: Build
        run: bunx turbo run build --cache-dir=.turbo

      # --- LLM-as-judge ---
      - name: Eval — LLM-as-judge
        continue-on-error: true
        run: bunx turbo run eval --cache-dir=.turbo -- --suite=judge --json --out eval-results/judge.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      # --- SWE-bench ---
      - name: Eval — SWE-bench
        continue-on-error: true
        run: bunx turbo run eval --cache-dir=.turbo -- --suite=swe-bench --json --out eval-results/swe-bench.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # --- Terminal-Bench ---
      - name: Eval — Terminal-Bench
        run: bunx turbo run eval --cache-dir=.turbo -- --suite=terminal-bench --json --out eval-results/terminal-bench.json

      # --- LoCoMo (memory / long-context) ---
      - name: Eval — LoCoMo
        run: bunx turbo run eval --cache-dir=.turbo -- --suite=locomo --json --out eval-results/locomo.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # --- 25-task curated benchmark (shared budget across benches) ---
      - name: Eval — 25-task curated benchmark
        run: bunx turbo run eval --cache-dir=.turbo -- --suite=curated --limit=25 --json --out eval-results/curated.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # --- Metrics tracking (passRate, latency over time) ---
      - name: Collect metrics
        if: always()
        run: |
          mkdir -p eval-results/metrics
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          for f in packages/server/eval-results/*.json; do
            [ -f "$f" ] || continue
            echo "Processing $f"
            F="$f" TS="$TS" bun -e '
              const fs = require("fs");
              const data = JSON.parse(fs.readFileSync(process.env.F, "utf8"));
              const metrics = {
                timestamp: process.env.TS,
                suite: data.suite ?? "unknown",
                passed: data.passed,
                passRate: data.passRate,
                passedCount: data.passedCount,
                total: data.total,
                threshold: data.threshold,
                durationMs: data.durationMs,
              };
              fs.writeFileSync("eval-results/metrics/" + metrics.suite + ".json", JSON.stringify(metrics, null, 2));
            ' || true
          done

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-${{ github.run_id }}
          path: |
            .turbo/**/eval-*.json
            packages/server/src/eval/results/**
            packages/server/eval-results/**
            eval-results/**
          if-no-files-found: warn

      - name: Publish summary
        if: always()
        run: |
          echo "## Nightly Eval — $(date -u +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          found=0
          for f in packages/server/eval-results/*.json; do
            [ -f "$f" ] || continue
            found=1
            echo "### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            head -60 "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$found" -eq 0 ]; then
            echo "No eval JSON found — check turbo eval outputs." >> "$GITHUB_STEP_SUMMARY"
          fi

  prod-drift:
    name: prod drift check
    runs-on: ubuntu-latest
    needs: nightly-eval
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Drift check
        env:
          EVAL_BASELINE_PATH: eval/baseline.json
          EVAL_RESULTS_GLOB: 'eval-results/**/*.json'
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          bun run eval -- --check-drift || echo "::warning::Drift check not configured or baseline missing"
      - name: Notify on drift
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ Nightly eval drift detected — ${new Date().toISOString().slice(0,10)}`;
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCheck eval artifacts for details.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['eval', 'drift'],
            }).catch(e => core.warning(`issue create failed: ${e.message}`));
